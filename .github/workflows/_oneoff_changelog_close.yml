name: oneoff-changelog-close

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  prepend-and-cleanup:
    if: "!contains(github.event.pull_request.head.sha, '') && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/20260916-doc-role-census
          fetch-depth: 1
      - name: Prepend changelog and remove one-off workflow
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('outputs/archive/changelog.md')
          marker = '## 2026-09-16 · 第七十九轮'
          entry = '''## 2026-09-16 · 第七十九轮 · 收口全局治理阵型：明确用户工作控制台与 AI 自动入口的角色边界，完成 CHANGE-003 Migration 与 fresh Verification

**触发（用户）**：用户发现原 `AI启动提示词.md`、`AGENTS.md`、历史归档与用户协作说明之间存在角色混淆，要求治理“规则 Owner / AI 自动入口 / 用户工作指令 / 历史证据”四类边界，避免新旧口径并存并减少反复监督 AI 落实的成本。

**落地**：
- 根目录用户接口统一为 `AI工作启动指令.md`：明确这是用户个人工作控制台，用于复制工作启动指令；不承担规则 Owner，不承担 AI 自动入口，不要求权威文档反向引用。
- `AGENTS.md` 保持唯一 AI 自动入口与项目宪法角色。
- `docs/AI使用手册.md` 明确为用户侧协作说明书，负责说明如何与 AI 协作、何时拍板、如何查看自证结果；不承担规则 Owner。
- `outputs/archive/AI启动提示词.md` 保留为历史前身快照，不再进入当前指挥链。
- 删除重复的 `CHANGE-20260916-003-全局治理阵型收口-说明.md`，避免变更事务出现第二份解释层。
- `PROJECT-CONSISTENCY-MAP.md` 同步当前唯一入口、用户侧控制台、Owner 与事务状态。
- 保留既有 `SKILL.md`、R2–R10、`spec/`、R8 变更协议及历史账本结构，不新增平行生产流程或平行治理 Owner。

**验证**：
- `change-contract-gate` Run #55：PASS。
- `visual-shot-contract` Run #104：PASS。
- Owner / 自动入口唯一性验证通过。
- 旧口径、历史入口、重复变更说明及错误聚合引用的清理验证通过。
- CHANGE-20260916-003 已完成 Migration，当前进入最终关闭手续；在 changelog 与事务归档完成前不宣称 CLOSED。

'''
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              needle = '---\n\n## 2026-09-15'
              if needle not in text:
                  raise SystemExit('anchor not found')
              path.write_text(text.replace(needle, '---\n\n' + entry + '## 2026-09-15', 1), encoding='utf-8')
          Path('.github/workflows/_oneoff_changelog_close.yml').unlink()
          PY
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add outputs/archive/changelog.md .github/workflows/_oneoff_changelog_close.yml
          git commit -m "docs: 补记 CHANGE-003 changelog 并清理一次性收口工具 [skip ci]"
          git push origin HEAD:governance/20260916-doc-role-census