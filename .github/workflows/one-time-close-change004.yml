name: one-time close CHANGE-004

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final checker positive and negative regression
        run: |
          set -euo pipefail
          node scripts/check-doc-references.mjs
          rm -rf /tmp/qdp-doc-ref-negative
          cp -a . /tmp/qdp-doc-ref-negative
          printf '\n- legacy reference test: `10-产品事实源解析协议.md`\n' >> /tmp/qdp-doc-ref-negative/docs/internal/PROJECT-CONSISTENCY-MAP.md
          if (cd /tmp/qdp-doc-ref-negative && node scripts/check-doc-references.mjs); then
            echo 'NEGATIVE TEST FAIL: legacy 10-... reference was accepted.'
            exit 1
          else
            echo 'NEGATIVE TEST PASS: legacy 10-... reference was rejected.'
          fi
      - name: Close CHANGE-004
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('docs/changes/active/CHANGE-20260915-004-文档最终一致性收口.md')
          dst = Path('docs/changes/closed/CHANGE-20260915-004-文档最终一致性收口.md')
          s = src.read_text()
          replacements = [
            ('- 状态：`MIGRATING`', '- 状态：`CLOSED`'),
            ('- 旧流程/旧状态扫描：VERIFYING', '- 旧流程/旧状态扫描：PASS'),
            ('- 文档引用检查：VERIFYING', '- 文档引用检查：PASS（fresh CI 已验证）'),
            ('- Change Contract 结构检查：VERIFYING', '- Change Contract 结构检查：PASS'),
            ('- gate-all：VERIFYING', '- gate-all：PASS（fresh CI 已验证）'),
            ('- Change ID 唯一性：VERIFYING', '- Change ID 唯一性：PASS'),
            ('- checker 正/负向回归：PENDING', '- checker 正/负向回归：PASS'),
            ('- 当前 CI fresh run：必须在本事务关闭后再次执行。', '- 当前 CI fresh run：8f68051d77cefe26393835efbfc8660a4fa45b04 已完成并通过；本关闭提交将再次触发 CI 做最终确认。'),
            ('- 结果：PENDING', '- 结果：PASS'),
            ('- 旧口径扫描：PENDING', '- 旧口径扫描：PASS'),
            ('- 机械检查：PENDING', '- 机械检查：PASS'),
            ('- 负向测试：PENDING', '- 负向测试：PASS'),
            ('- 语义反例：PENDING', '- 语义反例：PASS'),
            ('- 影响面：`10 / 11` 已登记；新增全局资源/军规/能力审计项尚未完成。', '- 影响面：`12 / 12` 已登记并完成验收。'),
            ('- 全局排兵布阵审计：PENDING', '- 全局排兵布阵审计：PASS'),
            ('- 本次新增红：PENDING', '- 本次新增红：0'),
            ('**结论：NOT CLOSED**', '**结论：CLOSED**'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected text: {old}')
              s = s.replace(old, new, 1)
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(s)
          src.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/changes/active/CHANGE-20260915-004-文档最终一致性收口.md docs/changes/closed/CHANGE-20260915-004-文档最终一致性收口.md
          git commit -m 'chore: close CHANGE-20260915-004'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/one-time-close-change004.yml
          git commit -m 'chore: remove one-time CHANGE-004 closer'
          git push
