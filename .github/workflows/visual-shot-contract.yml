# CI contract: source-of-truth map and fresh g11 keyframes are part of verification evidence.
# 2026-09-15 convergence run: verify Product Truth, local pixel probe, and production g11 scale together.
name: visual-shot-contract

on:
  push:
    paths:
      - 'outputs/**/08-R9视觉决策卡.md'
      - 'scripts/check-visual-shot-contract.mjs'
      - 'scripts/test-visual-shot-contract-negative.mjs'
      - 'scripts/check-ui-truth.mjs'
      - 'scripts/probe-safe-area.mjs'
      - 'docs/internal/R9-视觉导演与审美决策.md'
      - 'docs/internal/R9-视觉映射表.md'
      - 'docs/internal/R10-产品事实源解析协议.md'
      - 'docs/internal/R7-Remotion组件库.md'
      - 'spec/product-truth/**'
      - 'video/src/VTemplate.tsx'
      - 'video/src/videos/g11/**'
      - 'video/src/data/g11.ts'
      - '.github/workflows/visual-shot-contract.yml'
  pull_request:
    paths:
      - 'outputs/**/08-R9视觉决策卡.md'
      - 'scripts/check-visual-shot-contract.mjs'
      - 'scripts/test-visual-shot-contract-negative.mjs'
      - 'scripts/check-ui-truth.mjs'
      - 'scripts/probe-safe-area.mjs'
      - 'docs/internal/R9-视觉导演与审美决策.md'
      - 'docs/internal/R9-视觉映射表.md'
      - 'docs/internal/R10-产品事实源解析协议.md'
      - 'docs/internal/R7-Remotion组件库.md'
      - 'spec/product-truth/**'
      - 'video/src/VTemplate.tsx'
      - 'video/src/videos/g11/**'
      - 'video/src/data/g11.ts'
      - '.github/workflows/visual-shot-contract.yml'

jobs:
  visual-shot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install video dependencies
        run: npm ci --prefix video
      - name: Materialize APPLET snapshot when present
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../applet
          if [ -f "spec/product-truth/applet/source.tar.xz" ]; then
            mkdir -p ../applet
            tar -xJf spec/product-truth/applet/source.tar.xz -C ../applet
            count=$(find ../applet -type f \( -name '*.vue' -o -name '*.js' -o -name '*.json' \) | wc -l | tr -d ' ')
            test "$count" = "298"
            echo "APPLET Product Truth Snapshot materialized: $count source files."
          elif find spec/product-truth/applet -type f \( -name '*.vue' -o -name '*.js' -o -name '*.json' \) ! -name 'manifest.json' -print -quit | grep -q .; then
            mkdir -p ../applet
            find spec/product-truth/applet -type f \( -name '*.vue' -o -name '*.js' -o -name '*.json' \) ! -name 'manifest.json' -exec cp --parents '{}' ../applet/ \;
            count=$(find ../applet -type f \( -name '*.vue' -o -name '*.js' -o -name '*.json' \) | wc -l | tr -d ' ')
            test "$count" = "298"
            echo "APPLET snapshot materialized from committed source files: $count."
          else
            echo "APPLET Product Truth source is not committed; check-ui-truth remains a hard-fail."
          fi
      - name: Negative test
        run: node scripts/test-visual-shot-contract-negative.mjs
      - name: Visual shot contract
        run: node scripts/check-visual-shot-contract.mjs
      - name: Diagnostic - redlines
        run: node scripts/check-redlines.mjs
        continue-on-error: true
      - name: Diagnostic - doc references
        run: node scripts/check-doc-references.mjs
        continue-on-error: true
      - name: Diagnostic - facts
        run: node scripts/check-facts.mjs
        continue-on-error: true
      - name: Render fresh g11 keyframes for pixel-level verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/g11-烧烤/frames
          cd video
          for frame in 180 630 1200 1830 2460 2880; do
            ./node_modules/.bin/remotion still src/index.tsx g11 --frame="$frame" --concurrency=2 --output="../outputs/g11-烧烤/frames/ci-safe-${frame}.png"
          done
      - name: Upload fresh g11 frames for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: g11-safe-frames-${{ github.run_number }}
          path: outputs/g11-烧烤/frames/ci-safe-*.png
          if-no-files-found: error
          retention-days: 3
      - name: Diagnostic - safe area coordinates
        run: node scripts/probe-safe-area.mjs outputs/g11-烧烤/frames/ci-safe-180.png outputs/g11-烧烤/frames/ci-safe-630.png outputs/g11-烧烤/frames/ci-safe-1200.png outputs/g11-烧烤/frames/ci-safe-1830.png outputs/g11-烧烤/frames/ci-safe-2460.png outputs/g11-烧烤/frames/ci-safe-2880.png
        continue-on-error: true
      - name: Gate all
        run: node scripts/gate-all.mjs
