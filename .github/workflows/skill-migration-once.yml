name: skill-migration-once

on:
  push:
    paths:
      - '.github/workflows/skill-migration-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate SKILL resource references without rewriting workflow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'SKILL.md';
          let s = fs.readFileSync(p, 'utf8');
          const before = s;

          // First normalize every remaining historical filename reference to the current resource Owner.
          s = s.replace(/`官网资源库落地规划\.md`/g, '`docs/internal/内容资源调用协议.md`');
          s = s.replace(/官网资源库落地规划\.md/g, 'docs/internal/内容资源调用协议.md');

          // Remove section-number assumptions that belonged only to the archived document.
          s = s.replace(/`docs\/internal\/内容资源调用协议\.md` §2/g, '`docs/internal/内容资源调用协议.md`「官网读取」');
          s = s.replace(/`docs\/internal\/内容资源调用协议\.md` §3\/§4/g, '`docs/internal/内容资源调用协议.md`「三层信任边界」');
          s = s.replace(/第 3\/4 节避雷台账/g, '官网信任边界');

          if (s.includes('官网资源库落地规划.md')) {
            console.error('SKILL migration incomplete: stale archive reference remains');
            process.exit(2);
          }
          if (s === before) {
            console.error('SKILL migration made no changes');
            process.exit(3);
          }
          s = s.replace('version: 8.0.0', 'version: 8.0.1');
          s = s.replace('> 版本：8.0.0（2026-09-08 闭环故事 + 洞察库，变更史见 changelog）。本文是唯一作业文档、**做一条视频的完整方法**——文档是工具不是圣经，随做随改。', '> 版本：8.0.1（2026-09-16 资源调用收口）。本文是唯一作业文档、**做一条视频的完整方法**——文档是工具不是圣经，随做随改。\n> 当前官网、爆款语料、玩法版图的职责边界只认 `docs/internal/内容资源调用协议.md`；历史 archive 仅作证据，不得作为当前生产入口。');
          fs.writeFileSync(p, s);
          NODE
      - name: Verify no stale reference
        run: |
          ! grep -n '官网资源库落地规划\.md' SKILL.md
          ! grep -n 'outputs/archive/官网资源库落地规划\.md' SKILL.md
          grep -n 'docs/internal/内容资源调用协议\.md' SKILL.md
      - name: Commit migration and remove one-off workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/skill-migration-once.yml
          git add SKILL.md .github/workflows/skill-migration-once.yml
          git commit -m '治理：收口 SKILL 官网资源调用引用'
          git push

# trigger second push for one-time migration